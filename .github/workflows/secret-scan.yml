name: secret-scan

# Fork: no secret may ever reach this public repository. gitleaks scans every
# push and pull request (the whole history on pushes to main); GitHub secret
# scanning with push protection is on as well.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
